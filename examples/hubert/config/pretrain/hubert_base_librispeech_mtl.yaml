# @package _group_

common:
  fp16: true
  log_format: json
  log_interval: 10  # CHANGED. Originally 200
  seed: 1337
  tensorboard_logdir: tblog
  wandb_project: hubert_mtl

# Right now, with a batch size of 32, the number of steps in one epoch is around 170159/(32/2)= 10635 steps
# NB: the parameters are explained here: https://fairseq.readthedocs.io/en/latest/command_line_tools.html
checkpoint:
  save_interval_updates: 25000 # Will save the model every save_interval_updates steps
  keep_interval_updates: 1 # keep the last N checkpoints saved with –save-interval-updates
  no_epoch_checkpoints: true
  reset_optimizer: true # added by me to pre-train from a clean state
  reset_dataloader: true # added by me to pre-train from a clean state
  reset_meters: true # added by me to pre-train from a clean state


distributed_training:
  ddp_backend: no_c10d
  distributed_backend: 'nccl'
  distributed_world_size: 1 # How many GPUs to use. TODO: change if using multiple GPUs
  distributed_port: 29671
  nprocs_per_node: 1
  find_unused_parameters: true

task:
  _name: hubert_mtl_pretraining
  data: ???
  ssl_data: ??? # Added by me for MTL config
  label_dir: ???
  labels: ["km"]
  label_rate: ${model.label_rate}
  sample_rate: 16000
  max_sample_size: 250000
  min_sample_size: 32000
  pad_audio: false
  random_crop: true
  normalize: false # must be consistent with extractor

dataset:
  num_workers: 6 # Bcs I got a warning: get it back up to 6 when training for good
  #max_tokens: 1400000 # maximum number of tokens in a batch (another way to specify the batch size)
  batch_size: 32 # Added to try to replace the more obscure max_tokens
  skip_invalid_size_inputs_valid_test: true
  validate_interval: 5 # validate every N epochs
  validate_interval_updates: 10000 # validate every N updates -> Here, it corresponds to validate almost every epoch

criterion:
  _name: hubert_mtl
  pred_masked_weight: 1.0
  pred_nomask_weight: 0.0
  loss_weights: [10,] # TODO: change?
  supervised_task_weight: 0.1 # Added by me for MTL config

optimization:
  max_update: 57000 # force stop training at specified update. Originally 400000, but reduced it to have around 6/7 epochs.
  lr: [0.0005]
  clip_norm: 10.0 # clip threshold of gradients
  update_freq: [4] # ADDED by me to raise the batch size without OOM. # update parameters every N_i batches, when in epoch i 

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-06
  weight_decay: 0.01

lr_scheduler:
  _name: polynomial_decay
  warmup_updates: 32000 # Num of steps it takes before reaching the value specified in optimization.lr TODO: maybe reduce that value since my dataset is smaller

model:
  _name: hubert_mtl
  label_rate: ???
  skip_masked: false
  skip_nomask: false
  mask_prob: 0.80 # TODO: potential value to change
  mask_length: 10 # ADDED Each window is 20 ms, so this masks 200 ms. Taken from the default values. TODO: change it?
  extractor_mode: default
  conv_feature_layers: '[(512,10,5)] + [(512,3,2)] * 4 + [(512,2,2)] * 2'
  encoder_layerdrop: 0.05
  dropout_input: 0.1
  dropout_features: 0.1
  dropout: 0.1
  attention_dropout: 0.1
  feature_grad_mult: 0.1
  final_dim: 256 # In order to be consistent with the HuBERT pre-trained checkpoint
  untie_final_proj: true
  activation_dropout: 0.0
  num_classes_supervised: 61 # Added by me for MTL config
  proportion_supervised_data: 0.5  # Added by me for MTL config

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
